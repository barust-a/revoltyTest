name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rn-skeleton:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stacks/react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stacks/react-native/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:native
